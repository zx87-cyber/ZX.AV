name: Build ZX.AV

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  # =========================
  # Windows
  # =========================
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name ZXAV `
            --add-data "zxav-antivirus/license_keys.json;." `
            --add-data "zxav-antivirus/CHANGELOG.md;." `
            zxav-antivirus/app.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ZXAV-windows-exe
          path: dist/ZXAV.exe


  # =========================
  # Linux
  # =========================
  build-linux-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name ZXAV \
            --add-data "zxav-antivirus/license_keys.json:." \
            --add-data "zxav-antivirus/CHANGELOG.md:." \
            zxav-antivirus/app.py

      - name: Prepare AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp dist/ZXAV AppDir/usr/bin/ZXAV

          cat > AppDir/usr/share/applications/ZXAV.desktop << 'EOF'
          [Desktop Entry]
          Name=ZX.AV
          Exec=ZXAV
          Icon=ZXAV
          Type=Application
          Categories=Utility;Security;
          EOF

          cp AppDir/usr/share/applications/ZXAV.desktop AppDir/ZXAV.desktop

          touch AppDir/AppRun
          chmod +x AppDir/AppRun

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/ZXAV" "$@"
          EOF

      - name: Download appimagetool
        run: |
          wget -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ./appimagetool AppDir ZXAV-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ZXAV-linux-appimage
          path: ZXAV-x86_64.AppImage
