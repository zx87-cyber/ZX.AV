```yaml
name: Build ZX.AV

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --onefile --windowed --name ZXAV --add-data "zxav-antivirus/license_keys.json;." --add-data "zxav-antivirus/CHANGELOG.md;." zxav-antivirus/app.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZXAV-windows-exe
          path: dist/ZXAV.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Linux executable
        run: pyinstaller --noconfirm --onefile --name ZXAV --add-data "zxav-antivirus/license_keys.json:." --add-data "zxav-antivirus/CHANGELOG.md:." zxav-antivirus/app.py

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/ZXAV AppDir/usr/bin/ZXAV
          printf '%s\n' '[Desktop Entry]' 'Name=ZX.AV' 'Exec=ZXAV' 'Type=Application' 'Categories=Utility;System;' > AppDir/ZXAV.desktop
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/ZXAV" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Download appimagetool
        run: wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool

      - name: Make appimagetool executable
        run: chmod +x appimagetool

      - name: Build AppImage
        run: ./appimagetool AppDir ZXAV-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ZXAV-linux-appimage
          path: ZXAV-x86_64.AppImage
```
