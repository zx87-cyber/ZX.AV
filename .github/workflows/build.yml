name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name ZX.AV --add-data "license_keys.json;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZX.AV-windows
          path: dist/ZX.AV.exe
